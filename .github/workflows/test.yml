name: test

on:
  push:
    branches: [master]
  pull_request:

jobs:
  contract:
    name: .mcp.json contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate plugin manifest
        run: node --test test/mcp-contract.test.mjs
